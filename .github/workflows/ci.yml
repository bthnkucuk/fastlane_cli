name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # The fastlane_cli code itself is pure Dart, but it depends on
  # zenrouter_nocterm (git dep) whose pubspec declares an `sdk: flutter`
  # constraint. dart pub get refuses to resolve it without the Flutter
  # toolchain on PATH — so we install Flutter (Dart comes bundled).
  FLUTTER_VERSION: "3.41.9"
  # Opt every JavaScript action into Node.js 24 ahead of GitHub's forced
  # rollout (June 2026). Removes the deprecation banner now and avoids
  # surprises when older actions get auto-upgraded.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter (provides Dart)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run tests with coverage
        run: dart run coverage:test_with_coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: coverage/lcov.info
          retention-days: 7

  ruby_test:
    # Pure-Ruby specs for fastlane/common_helpers.rb + fastlane/storepilot_bridge.rb.
    # Runs in parallel with the Dart job so a Ruby regression surfaces immediately
    # rather than waiting for the Dart suite to finish.
    #
    # Matrix on ruby-version: 3.2 is the floor enforced by `fastlane_cli doctor`
    # (and brew install's depends_on "fastlane" pulls a Ruby that's typically
    # newer). Adding 3.3 and 3.4 catches forward-incompat early.
    name: Ruby specs (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: fastlane
          bundler-cache: true

      - name: Run RSpec
        working-directory: fastlane
        run: bundle exec rspec

  coverage:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `main` is branch-protected with 4 required status checks, so the bot
    # cannot push the badge commit directly (GH006). Open / update a PR
    # instead — it auto-runs CI on the PR branch and is mergeable once
    # `Analyze + Test` + the 3 Ruby legs are green.
    permissions:
      contents: write
      pull-requests: write
    # Serialize coverage runs so two near-simultaneous main pushes don't both
    # try to open/update the badge PR at once. cancel-in-progress=false ensures
    # the second run waits rather than discarding work.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    env:
      # Declared at job level so linters can resolve ${{ env.COVERAGE_PERCENT }}
      # in the badge-PR step. The actual value is written into GITHUB_ENV by
      # the "Update coverage badge" step.
      COVERAGE_PERCENT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: lcov
          path: coverage

      - name: Update coverage badge
        run: |
          LCOV_INFO="coverage/lcov.info"

          total_lines=$(grep -o "LF:[0-9]*" "$LCOV_INFO" | cut -d: -f2 | awk '{s+=$1} END {print s}')
          covered_lines=$(grep -o "LH:[0-9]*" "$LCOV_INFO" | cut -d: -f2 | awk '{s+=$1} END {print s}')

          if [ -z "$total_lines" ] || [ "$total_lines" -eq 0 ]; then
            percent=0
          else
            percent=$(awk "BEGIN {printf \"%.1f\", $covered_lines * 100 / $total_lines}")
          fi

          echo "Coverage: $percent%"

          if (( $(echo "$percent < 50" | bc -l) )); then
            color="red"
          elif (( $(echo "$percent < 80" | bc -l) )); then
            color="yellow"
          else
            color="brightgreen"
          fi

          new_badge="![coverage](https://img.shields.io/badge/coverage-${percent}%25-${color})"
          sed -i "s|^!\[coverage\].*|$new_badge|" README.md

          echo "COVERAGE_PERCENT=$percent" >> $GITHUB_ENV

      - name: Open / update coverage badge PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update coverage badge to ${{ env.COVERAGE_PERCENT }}%"
          branch: chore/coverage-badge
          delete-branch: true
          title: "chore: bump coverage badge to ${{ env.COVERAGE_PERCENT }}%"
          body: |
            Auto-generated coverage badge update.

            Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Coverage: ${{ env.COVERAGE_PERCENT }}%
          base: main
          labels: ci, coverage
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
