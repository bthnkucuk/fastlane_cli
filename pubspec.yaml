name: fastlane_cli
description: Terminal-first Fastlane assistant for categorized lane execution and store guides.
version: 0.4.4
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"

executables:
  fastlane_cli: fastlane_cli

dependencies:
  args: ^2.7.0
  nocterm: ^0.6.0
  path: ^1.9.1
  slang: ^4.14.0
  yaml: ^3.1.3
  zenrouter_nocterm:
    git:
      url: https://github.com/definev/zenrouter
      ref: feat/zenrouter_nocterm
      path: packages/zenrouter_nocterm

dependency_overrides:
  nocterm: ^0.6.0

dev_dependencies:
  build_runner: ^2.4.0
  collection: ^1.19.1
  coverage: ^1.15.0
  lints: ^6.1.0
  meta: ^1.18.2
  slang_build_runner: ^4.14.0
  test: ^1.26.3
